[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pavement-analytics"
version = "0.3.0"
description = "Generic tools for PCI, deduct values, and PAVER exports"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0,<3", "pandas>=2.2,<3", "scipy>=1.14,<2",
  "scikit-learn>=1.5,<2", "openpyxl>=3.1.5,<4"
]

[project.optional-dependencies]
climate = ["cdsapi>=0.7.7,<1"]

[project.scripts]
pavement = "pavement_analytics.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
include-package-data = false
